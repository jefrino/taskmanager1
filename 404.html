<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow Pro - Real-Time Collaborative Task Management</title>
  <meta name="description" content="Next-generation task management application with real-time WebSocket sync, Kanban board, list view, calendar, and analytics." />
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca'
            }
          }
        }
      }
    }
  </script>

  <!-- Custom stylesheet -->
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen flex flex-col font-sans transition-colors duration-200 select-none md:select-auto">


  <!-- ================= Top Navigation Bar ================= -->
  <header class="sticky top-0 z-30 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200/80 dark:border-slate-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
      
      <!-- Brand & View Selector -->
      <div class="flex items-center gap-6">
        <div class="flex items-center gap-2.5 cursor-pointer" onclick="state.setView('kanban')">
          <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white shadow-md shadow-indigo-500/25">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path>
            </svg>
          </div>
          <div>
            <h1 class="text-base font-extrabold tracking-tight bg-gradient-to-r from-slate-900 to-slate-700 dark:from-white dark:to-slate-300 bg-clip-text text-transparent">
              TaskFlow <span class="text-xs px-1.5 py-0.5 rounded-md bg-indigo-500/10 text-indigo-600 dark:text-indigo-400 font-bold ml-1 uppercase">Pro</span>
            </h1>
          </div>
        </div>

        <!-- View Switcher (Desktop Tabs) -->
        <nav class="hidden lg:flex items-center bg-slate-100 dark:bg-slate-800/80 p-1 rounded-xl text-xs font-semibold">
          <button class="view-nav-btn flex items-center gap-1.5 px-3 py-1.5 rounded-lg transition" data-view="kanban">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="3" y="3" width="5" height="18" rx="1"></rect><rect x="10" y="3" width="5" height="12" rx="1"></rect><rect x="17" y="3" width="5" height="15" rx="1"></rect></svg>
            <span>Board</span>
          </button>
          <button class="view-nav-btn flex items-center gap-1.5 px-3 py-1.5 rounded-lg transition" data-view="list">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
            <span>List</span>
          </button>
          <button class="view-nav-btn flex items-center gap-1.5 px-3 py-1.5 rounded-lg transition" data-view="calendar">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
            <span>Calendar</span>
          </button>
          <button class="view-nav-btn flex items-center gap-1.5 px-3 py-1.5 rounded-lg transition" data-view="dashboard">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
            <span>Analytics</span>
          </button>
        </nav>
      </div>

      <!-- Center Search Bar -->
      <div class="flex-1 max-w-md hidden md:block">
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          </div>
          <input 
            type="text" 
            id="global-search-input" 
            placeholder="Search tasks, descriptions, tags... (Ctrl+K)" 
            class="w-full pl-9 pr-12 py-1.5 text-xs rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-100/70 dark:bg-slate-800/60 focus:bg-white dark:focus:bg-slate-900 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition" 
          />
          <div class="absolute inset-y-0 right-0 pr-2.5 flex items-center pointer-events-none">
            <kbd class="text-[10px] font-mono font-medium px-1.5 py-0.5 rounded bg-slate-200 dark:bg-slate-700 text-slate-500 dark:text-slate-400">⌘K</kbd>
          </div>
        </div>
      </div>

      <!-- Right Controls: WebSocket Badge, New Task, Dark Mode, Profile -->
      <div class="flex items-center gap-3">
        <!-- Live WebSocket Indicator Pill -->
        <div id="ws-status-badge" class="flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700/60" title="WebSocket status">
          <span class="w-2 h-2 rounded-full bg-slate-400"></span>
          <span class="hidden sm:inline font-medium text-slate-500">Connecting...</span>
        </div>

        <!-- Online presence counter -->
        <span id="presence-count" class="hidden xl:inline text-[11px] font-medium text-slate-400">1 online</span>

        <!-- Primary New Task Button -->
        <button id="primary-new-task-btn" class="flex items-center gap-1.5 px-3.5 py-1.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white text-xs font-semibold shadow-md shadow-indigo-600/20 transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          <span class="hidden sm:inline">New Task</span>
          <kbd class="hidden md:inline ml-1 text-[10px] opacity-70 font-mono">N</kbd>
        </button>

        <!-- Dark / Light Theme Toggle -->
        <button id="theme-toggle-btn" class="p-2 rounded-xl border border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition" title="Toggle Dark/Light Mode">
          <span class="dark:hidden"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg></span>
          <span class="hidden dark:inline"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg></span>
        </button>

        <!-- User Menu Dropdown -->
        <div class="relative">
          <button id="user-menu-btn" class="flex items-center gap-2 p-1 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 transition">
            <div class="w-8 h-8 rounded-full bg-slate-200 dark:bg-slate-700 animate-pulse"></div>
          </button>

          <!-- Dropdown Menu -->
          <div id="user-dropdown" class="hidden absolute right-0 mt-2 w-52 bg-white dark:bg-slate-900 rounded-2xl shadow-xl border border-slate-200/80 dark:border-slate-800 py-1.5 z-40">
            <button id="reseed-data-btn" class="w-full text-left px-4 py-2 text-xs font-medium text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 flex items-center gap-2">
              <svg class="w-3.5 h-3.5 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
              <span>Restore Demo Tasks</span>
            </button>
            <div class="my-1 border-t border-slate-100 dark:border-slate-800"></div>
            <button id="logout-btn" class="w-full text-left px-4 py-2 text-xs font-medium text-rose-600 dark:text-rose-400 hover:bg-rose-50 dark:hover:bg-rose-950/40 flex items-center gap-2">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
              <span>Sign Out</span>
            </button>
          </div>
        </div>

      </div>
    </div>

    <!-- Secondary Filter Bar (Quick filters: Priority, Assignee) -->
    <div class="border-t border-slate-200/60 dark:border-slate-800/60 px-4 sm:px-6 lg:px-8 py-2 bg-slate-50/50 dark:bg-slate-900/30 flex items-center justify-between gap-3 text-xs">
      <div class="flex items-center gap-2 overflow-x-auto py-0.5">
        <span class="text-slate-400 font-medium">Filters:</span>
        <select id="filter-priority" class="px-2.5 py-1 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 font-medium focus:outline-none">
          <option value="">All Priorities</option>
          <option value="urgent">🔥 Urgent</option>
          <option value="high">🔺 High</option>
          <option value="medium">⚡ Medium</option>
          <option value="low">🔹 Low</option>
        </select>

        <select id="filter-assignee" class="px-2.5 py-1 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 font-medium focus:outline-none">
          <option value="">All Assignees</option>
          <option value="mine">Assigned to Me</option>
          <option value="unassigned">Unassigned</option>
        </select>
      </div>

      <!-- Mobile Search Shortcut -->
      <div class="md:hidden flex-1 max-w-[160px]">
        <input type="text" id="mobile-search-input" placeholder="Search..." oninput="state.setFilters({ search: this.value })" class="w-full px-2.5 py-1 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-xs" />
      </div>
    </div>
  </header>

  <!-- ================= Main App Content Container ================= -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 flex flex-col overflow-hidden pb-20 md:pb-8">
    <div id="view-container" class="flex-1 h-full min-h-[500px]">
      <!-- Views will be dynamically injected here -->
    </div>
  </main>

  <!-- ================= Mobile Bottom Navigation Bar ================= -->
  <div class="lg:hidden fixed bottom-0 inset-x-0 bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border-t border-slate-200 dark:border-slate-800 py-2 px-6 flex items-center justify-around z-30 shadow-lg">
    <button class="mobile-nav-btn flex flex-col items-center gap-1 text-[11px] font-semibold" data-view="kanban">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="3" y="3" width="5" height="18" rx="1"></rect><rect x="10" y="3" width="5" height="12" rx="1"></rect><rect x="17" y="3" width="5" height="15" rx="1"></rect></svg>
      <span>Board</span>
    </button>
    <button class="mobile-nav-btn flex flex-col items-center gap-1 text-[11px] font-semibold" data-view="list">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
      <span>List</span>
    </button>
    <button class="mobile-nav-btn flex flex-col items-center gap-1 text-[11px] font-semibold" data-view="calendar">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
      <span>Calendar</span>
    </button>
    <button class="mobile-nav-btn flex flex-col items-center gap-1 text-[11px] font-semibold" data-view="dashboard">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
      <span>Analytics</span>
    </button>
  </div>

  <!-- ================= Task Create / Edit Modal ================= -->
  <div id="task-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
    <div class="fixed inset-0 bg-slate-900/60 modal-backdrop" onclick="TaskModal.close()"></div>
    
    <div class="relative bg-white dark:bg-slate-900 rounded-2xl shadow-2xl border border-slate-200 dark:border-slate-800 w-full max-w-xl max-h-[90vh] flex flex-col overflow-hidden z-10">
      <div class="px-6 py-4 border-b border-slate-200/80 dark:border-slate-800 flex items-center justify-between">
        <h3 id="task-modal-title" class="text-base font-bold text-slate-800 dark:text-slate-100">Create New Task</h3>
        <button id="task-modal-close" class="p-1 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 rounded-lg">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>

      <div class="p-6 overflow-y-auto space-y-4">
        <!-- Title -->
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Title *</label>
          <input type="text" id="task-input-title" placeholder="e.g. Redesign checkout funnel" class="w-full px-3.5 py-2 text-sm rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
        </div>

        <!-- Description -->
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Description</label>
          <textarea id="task-input-desc" rows="3" placeholder="Provide background context, criteria, or notes..." class="w-full px-3.5 py-2 text-sm rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-indigo-500 focus:outline-none"></textarea>
        </div>

        <!-- Status & Priority Row -->
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Status</label>
            <select id="task-input-status" class="w-full px-3 py-2 text-xs font-semibold rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-indigo-500">
              <option value="backlog">Backlog</option>
              <option value="todo">To Do</option>
              <option value="in_progress">In Progress</option>
              <option value="in_review">In Review</option>
              <option value="completed">Completed</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Priority</label>
            <select id="task-input-priority" class="w-full px-3 py-2 text-xs font-semibold rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-indigo-500">
              <option value="urgent">🔥 Urgent</option>
              <option value="high">🔺 High</option>
              <option value="medium" selected>⚡ Medium</option>
              <option value="low">🔹 Low</option>
            </select>
          </div>
        </div>

        <!-- Due Date & Assignee Row -->
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Due Date</label>
            <input type="datetime-local" id="task-input-due" class="w-full px-3 py-2 text-xs rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-indigo-500" />
          </div>

          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Assignee</label>
            <select id="task-input-assignee" class="w-full px-3 py-2 text-xs rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-indigo-500">
              <option value="">Unassigned</option>
            </select>
          </div>
        </div>

        <!-- Tags -->
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Tags (Comma-separated)</label>
          <input type="text" id="task-input-tags" placeholder="e.g. Design, Frontend, Release-v1" class="w-full px-3.5 py-2 text-xs rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-indigo-500" />
        </div>

        <!-- Subtasks Section (during creation) -->
        <div id="task-modal-subtasks-section">
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">Checklist / Subtasks</label>
          <div id="modal-subtasks-list" class="space-y-1.5 mb-2"></div>
          <div class="flex items-center gap-2">
            <input type="text" id="modal-subtask-input" placeholder="+ Add a checklist item..." class="flex-1 px-3 py-1.5 text-xs rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800" />
            <button type="button" id="modal-add-subtask-btn" class="px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs font-semibold hover:bg-slate-200 dark:hover:bg-slate-700">Add</button>
          </div>
        </div>
      </div>

      <div class="px-6 py-4 border-t border-slate-200/80 dark:border-slate-800 flex items-center justify-end gap-3 bg-slate-50/50 dark:bg-slate-900/50">
        <button type="button" id="task-modal-cancel" class="px-4 py-2 rounded-xl text-xs font-semibold text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition">Cancel</button>
        <button type="button" id="task-modal-save" class="px-5 py-2 rounded-xl text-xs font-semibold bg-indigo-600 hover:bg-indigo-700 text-white shadow-md shadow-indigo-600/20 transition">Save Task</button>
      </div>
    </div>
  </div>

  <!-- ================= Task Detail Slide-over Drawer ================= -->
  <div id="task-detail-drawer" class="hidden fixed inset-0 z-50 overflow-hidden">
    <div class="fixed inset-0 bg-slate-900/50 modal-backdrop" onclick="TaskDetailDrawer.close()"></div>
    <div class="fixed inset-y-0 right-0 max-w-full flex pl-10">
      <div class="w-screen max-w-md md:max-w-lg bg-white dark:bg-slate-900 shadow-2xl border-l border-slate-200 dark:border-slate-800 flex flex-col">
        <div id="task-detail-content" class="flex-1 overflow-y-auto">
          <!-- Content dynamically rendered by TaskDetailDrawer -->
        </div>
      </div>
    </div>
  </div>

  <!-- ================= Auth Modal (Login / Sign Up) ================= -->
  <div id="auth-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
    <div class="fixed inset-0 bg-slate-950/70 modal-backdrop"></div>
    
    <div class="relative bg-white dark:bg-slate-900 rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-800 w-full max-w-md p-6 sm:p-8 z-10">
      <div class="text-center mb-6">
        <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-indigo-600 to-violet-500 mx-auto flex items-center justify-center text-white shadow-lg shadow-indigo-500/25 mb-3">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
        </div>
        <h2 id="auth-modal-title" class="text-xl font-bold text-slate-800 dark:text-slate-100">Sign In to TaskFlow</h2>
        <p class="text-xs text-slate-400 mt-1">Real-time collaborative task workspace</p>
      </div>

      <!-- Quick 1-Click Demo Logins -->
      <div class="mb-6 p-4 rounded-2xl bg-indigo-50/70 dark:bg-indigo-950/30 border border-indigo-100 dark:border-indigo-900/40">
        <p class="text-[11px] font-bold uppercase tracking-wider text-indigo-600 dark:text-indigo-400 mb-2.5">⚡ 1-Click Demo Accounts</p>
        <div class="grid grid-cols-2 gap-2">
          <button type="button" id="demo-login-alex" class="p-2 rounded-xl bg-white dark:bg-slate-800 text-left border border-indigo-200 dark:border-indigo-800 hover:border-indigo-500 transition shadow-2xs">
            <span class="block text-xs font-bold text-slate-800 dark:text-slate-100 truncate">Alex Rivera</span>
            <span class="block text-[10px] text-indigo-500 font-semibold">Tech Lead (Admin)</span>
          </button>
          <button type="button" id="demo-login-sarah" class="p-2 rounded-xl bg-white dark:bg-slate-800 text-left border border-indigo-200 dark:border-indigo-800 hover:border-indigo-500 transition shadow-2xs">
            <span class="block text-xs font-bold text-slate-800 dark:text-slate-100 truncate">Sarah Chen</span>
            <span class="block text-[10px] text-indigo-500 font-semibold">Designer (Member)</span>
          </button>
        </div>
      </div>

      <div class="relative flex py-2 items-center mb-4">
        <div class="flex-grow border-t border-slate-200 dark:border-slate-800"></div>
        <span class="flex-shrink mx-3 text-[11px] font-semibold text-slate-400 uppercase">Or Continue with</span>
        <div class="flex-grow border-t border-slate-200 dark:border-slate-800"></div>
      </div>

      <div class="space-y-3.5">
        <div id="auth-register-name-row" style="display: none;">
          <label class="block text-xs font-bold text-slate-600 dark:text-slate-400 mb-1">Full Name</label>
          <input type="text" id="auth-input-name" placeholder="John Doe" class="w-full px-3.5 py-2 text-xs rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-indigo-500" />
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-600 dark:text-slate-400 mb-1">Email</label>
          <input type="email" id="auth-input-email" placeholder="you@company.com" class="w-full px-3.5 py-2 text-xs rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-indigo-500" />
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-600 dark:text-slate-400 mb-1">Password</label>
          <input type="password" id="auth-input-password" placeholder="••••••••" class="w-full px-3.5 py-2 text-xs rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-indigo-500" />
        </div>

        <button type="button" id="auth-submit-btn" class="w-full py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs shadow-md shadow-indigo-600/20 transition mt-2">
          Sign In
        </button>

        <p class="text-center text-xs text-slate-500 mt-3">
          <span id="auth-switch-prompt">Don't have an account?</span>
          <button type="button" id="auth-switch-link" class="text-indigo-600 dark:text-indigo-400 font-bold hover:underline ml-1">Sign Up</button>
        </p>
      </div>
    </div>
  </div>

  <!-- ================= Confirmation Modal ================= -->
  <div id="confirm-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
    <div class="fixed inset-0 bg-slate-950/60 modal-backdrop"></div>
    <div class="relative bg-white dark:bg-slate-900 rounded-2xl shadow-xl border border-slate-200 dark:border-slate-800 w-full max-w-sm p-6 z-10">
      <h3 id="confirm-modal-title" class="text-base font-bold text-slate-900 dark:text-slate-100 mb-2">Confirm Action</h3>
      <p id="confirm-modal-msg" class="text-xs text-slate-600 dark:text-slate-400 leading-relaxed mb-6">Are you sure?</p>
      <div class="flex items-center justify-end gap-2.5">
        <button id="confirm-modal-cancel" class="px-3.5 py-1.5 rounded-xl text-xs font-semibold text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition">Cancel</button>
        <button id="confirm-modal-btn" class="px-4 py-1.5 rounded-xl text-xs font-semibold bg-rose-600 hover:bg-rose-700 text-white shadow-sm transition">Confirm</button>
      </div>
    </div>
  </div>

  <!-- ================= Toast Notification Floating Stack ================= -->
  <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-auto"></div>

  <script src="./js/app.js"></script>
